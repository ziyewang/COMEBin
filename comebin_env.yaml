# Modern COMEBin 1.1.0 non-PyTorch dependencies validated on 2026-07-17.
# Install a device-appropriate PyTorch build separately after creating this environment.
name: COMEBin
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.13.14
  - pip=26.1.2
  - bedtools=2.31.1
  - biolib=0.1.9
  - bwa=0.7.19
  - checkm-genome=1.2.3
  - fraggenescan=1.32
  - hmmer=3.4
  - pplacer=1.1.alpha19
  - prodigal=2.6.3
  - samtools=1.24
  - pip:
      - atomicwrites==1.4.1
      - biopython==1.87
      - click==8.4.2
      - gdown==6.1.0
      - hnswlib==0.8.0
      - igraph==1.0.0
      - joblib==1.5.3
      - leidenalg==0.12.0
      - matplotlib==3.10.9
      - networkx==3.6.1
      - numba==0.66.0
      - numpy==2.4.6
      - pandas==3.0.3
      - pyyaml==6.0.3
      - ruamel.yaml==0.19.1
      - scanpy==1.12.2
      - scikit-learn==1.9.0
      - scipy==1.18.0
      - seaborn==0.13.2
      # CheckM 1.2.3 still imports pkg_resources, removed in setuptools 81+.
      - setuptools==80.9.0
      - statsmodels==0.14.6
      - tensorboard==2.21.0
      - tqdm==4.68.4
